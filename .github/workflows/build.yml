# Builds the Windows installer and the macOS disk images when a v* tag is pushed (or by hand), and attaches them to
# a draft GitHub release for that tag. If the release is already published, electron-builder leaves its files alone.
# Signing: see docs/DEVELOPING.md.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write # the repository's token is read-only by default; this lets electron-builder make the draft release
jobs:
  # One draft for the tag, made before the builds start. Left to electron-builder, its uploads each made a draft at
  # the same moment and the files ended up split between them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Netpals ${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: release
    if: ${{ !failure() && !cancelled() }} # by hand there's no tag, so no release job, and the build still runs
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the other
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Secrets that aren't set arrive as empty variables, and electron-builder reads an empty CSC_LINK as a certificate
      # path (the project folder: "not a file"), so empty ones are dropped first. Without an Apple certificate the Mac
      # app is ad-hoc signed, since Apple Silicon won't run an unsigned app at all.
      - shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -z "${!v}" ] && unset "$v"; done
          publish=${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra=""
            if [ -z "${CSC_LINK:-}" ]; then extra="-c.mac.identity=- -c.mac.hardenedRuntime=false"; fi
            npx electron-builder --mac --publish "$publish" $extra
          else
            npx electron-builder --win --publish "$publish"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: netpals-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
