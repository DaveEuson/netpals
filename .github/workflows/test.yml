# Runs the whole test suite on a real Mac, builds the disk images (Apple Silicon and Intel), and smoke-tests the
# packaged app. By hand only (Actions tab, or: gh workflow run test.yml), since macOS minutes count ten times on a
# private repo. Keeps the window tests' screenshots and the disk images as artifacts.
name: test
on:
  workflow_dispatch:
    inputs:
      os:
        description: Where to test
        type: choice
        options: [macos-latest, windows-latest]
        default: macos-latest
      tests:
        description: Run the test suite (untick to only build and smoke-test)
        type: boolean
        default: true
jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --verbose
        if: inputs.tests
      - run: npm test -- screenshots
        if: inputs.tests
      - name: Build (the Mac disk images ad-hoc signed)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          else npx electron-builder --win --dir --publish never; fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=dist/mac-arm64/Netpals.app
            codesign --verify --deep --strict --verbose=2 "$app" && echo "codesign: valid (ad-hoc)"
            mkdir -p smoke-logs && SMOKE_LOGS=smoke-logs node scripts/smoke.js "$app/Contents/MacOS/Netpals"
          else node scripts/smoke.js dist/win-unpacked/Netpals.exe; fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.tests
        with:
          name: screenshots-${{ inputs.os }}
          path: |
            tests/out/*.png
            docs/images/*.png
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: smoke-logs
          path: smoke-logs/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: netpals-mac
          path: dist/*.dmg
          if-no-files-found: error
