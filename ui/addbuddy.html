<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Add a Buddy</title>
<link rel="stylesheet" href="xp.css">
<script src="chrome.js"></script>
<style>
  .tabs { flex: none; display: flex; gap: 2px; padding: 10px 12px 0; }
  .tabs button { position: relative; top: 1px; height: 26px; padding: 0 14px; border: 1px solid var(--line); border-radius: 3px 3px 0 0; background: var(--tab); color: var(--ink); font: inherit; cursor: pointer; }
  .tabs button[aria-selected=true] { background: var(--panel); border-bottom-color: var(--panel); box-shadow: inset 0 2px 0 var(--glow); font-weight: bold; }
  .sheet { flex: 1; min-height: 0; margin: 0 12px; padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  #roll { align-self: flex-start; height: 26px; font-weight: bold; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--win); border: 1px solid var(--groove); }
  .card .tile { width: 40px; height: 40px; font-size: 22px; }
  .card .prof { display: flex; flex-direction: column; gap: 3px; padding-top: 7px; border-top: 1px dotted var(--groove); font-size: 11px; }
  .quote { font-family: Georgia, "Times New Roman", serif; font-style: italic; color: var(--them); }
  .form { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; row-gap: 7px; column-gap: 8px; }
  .form textarea { height: 58px; }
  #m-emoji { width: 44px; }
  #m-era { width: 90px; }
  #ok { min-width: 110px; }
</style>
<title-bar></title-bar>
<div class="tabs" role="tablist">
  <button role="tab" id="tab-random" aria-selected="true">Randomize</button>
  <button role="tab" id="tab-manual" aria-selected="false">Build your own</button>
</div>
<div class="sheet sunken" id="random">
  <div class="col" style="gap: 4px">
    <label for="vibe"><b>Describe a vibe in one line</b></label>
    <input id="vibe" type="text" maxlength="200" placeholder="a skater kid from 2001 who's weirdly good at taxes">
    <span class="tiny muted">Their name, era, voice and profile are all made up from this.</span>
  </div>
  <button class="btn" id="roll">
    <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="5.5" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1" fill="currentColor"/></svg>
    <span id="roll-label">Roll the dice</span>
  </button>
  <div class="card" id="card" hidden>
    <div style="display: flex; align-items: center; gap: 9px">
      <span class="tile" id="c-emoji" aria-hidden="true"></span>
      <div class="col" style="flex: 1; gap: 2px"><b id="c-sn" style="font-size: 13px"></b><span class="small muted" id="c-who"></span></div>
    </div>
    <span class="small" id="c-persona" style="line-height: 1.45"></span>
    <div class="prof">
      <span class="quote" id="c-quote"></span>
      <span><b>listening to:</b> <span id="c-listen"></span></span>
      <span><b>fave link:</b> <span id="c-link"></span></span>
      <span class="muted" id="c-nudge"></span>
    </div>
  </div>
</div>
<div class="sheet sunken" id="manual" hidden>
  <div class="form">
    <label for="m-name">Name</label><input id="m-name" type="text" maxlength="30" placeholder="Kevin">
    <label for="m-sn">Screen name</label><input id="m-sn" type="text" maxlength="24" placeholder="kickflip_kev01">
    <label for="m-emoji">Icon</label><input id="m-emoji" type="text" maxlength="8" placeholder="🛹">
    <label for="m-era">Era</label><select id="m-era"></select>
    <label for="m-persona" style="align-self: start; padding-top: 3px">Personality</label>
    <textarea id="m-persona" rows="3" maxlength="800" placeholder="A laid-back skater. Who are they? How do they talk?"></textarea>
    <label for="m-cad">Pings you</label>
    <div class="col" style="gap: 1px">
      <input id="m-cad" type="range" min="1" max="10" step="1" value="5">
      <div class="tiny muted" style="display: flex; justify-content: space-between" aria-hidden="true"><span>rarely</span><span>often</span></div>
    </div>
    <span></span><label class="check"><input type="checkbox" id="m-nudge"><span>Checks in if you leave them hanging</span></label>
    <label for="m-quote">Profile quote</label><input id="m-quote" type="text" maxlength="140" placeholder="the board knows.">
    <label for="m-listen">Listening to</label><input id="m-listen" type="text" maxlength="80" placeholder="a made-up band and song">
    <label for="m-link">Fave link</label><input id="m-link" type="text" maxlength="120" placeholder="http://">
  </div>
  <span class="tiny muted">Leave the profile blank and your buddy writes their own.</span>
</div>
<footer>
  <span id="status" class="small muted" role="status"></span>
  <button class="btn default" id="ok" disabled>Add to my list</button>
  <button class="btn" data-win="close">Cancel</button>
</footer>
<script src="addbuddy.js"></script>
