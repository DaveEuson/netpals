<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Instant Message</title>
<link rel="stylesheet" href="xp.css">
<script src="chrome.js"></script>
<style>
  .info { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-bottom: 1px solid var(--groove); }
  .info .tile { width: 36px; height: 36px; font-size: 22px; }
  #sn { font-weight: bold; font-size: 13px; align-self: flex-start; }
  #log { flex: 1; min-height: 0; margin: 8px 8px 0; padding: 8px 10px; overflow: auto; display: flex; flex-direction: column; gap: 9px; user-select: text; }
  .stamp { align-self: center; font-size: 10px; color: var(--muted); }
  .msg { display: flex; align-items: flex-start; gap: 8px; }
  .msg .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .msg .text { line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .head { font-size: 11px; }
  .msg .head b { color: var(--them); }
  .msg .head .when { color: var(--muted); }
  .msg.me { justify-content: flex-end; padding-left: 60px; }
  .msg.me .body { align-items: flex-end; }
  .msg.me .text { text-align: right; }
  .msg.me .head b { color: var(--accent); }
  .msg.auto .text, .msg.err .text, .msg.notice .text { color: var(--muted); font-style: italic; }
  .msg.err .text { color: var(--hot); }
  .thumbs { flex: none; display: flex; gap: 2px; }
  .thumbs button { width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--groove); border-radius: 3px; background: var(--panel); color: var(--muted); cursor: pointer; }
  .thumbs button:hover { border-color: var(--glow); }
  .thumbs .up[aria-pressed=true] { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
  .thumbs .down[aria-pressed=true] { background: var(--badge); border-color: var(--badge); color: #fff; }
  #typing { flex: none; height: 20px; margin: 0 8px; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .compose { flex: none; display: flex; gap: 8px; padding: 0 8px 10px; }
  #text { flex: 1; height: 58px; }
  #send { flex: none; width: 72px; height: 58px; flex-direction: column; gap: 4px; font-weight: bold; }
</style>
<title-bar min></title-bar>
<div class="info">
  <span class="tile" id="emoji" aria-hidden="true"></span>
  <div class="col" style="flex: 1; gap: 2px">
    <a id="sn" title="Show their profile"></a>
    <span class="small muted" id="status"></span>
  </div>
  <button class="btn" id="info" style="min-width: 0; padding: 0 10px; font-size: 11px">
    <svg class="icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 5.2v3.5 M6 3.2v.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span>Info</span>
  </button>
</div>
<div id="log" class="sunken" role="log" aria-live="polite"></div>
<div id="typing" aria-live="polite"></div>
<div class="compose">
  <label for="text" class="sr" id="text-label">Message</label>
  <textarea id="text" rows="3" maxlength="1000" placeholder="Type a message…"></textarea>
  <button class="btn default" id="send">
    <svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 9l14-6-5 13-2.5-5.5z M8.5 10.5L16 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <span>Send</span>
  </button>
</div>
<script src="chat.js"></script>
