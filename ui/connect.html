<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Connecting to Netpals</title>
<link rel="stylesheet" href="xp.css">
<script src="chrome.js"></script>
<style>
  main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 0; }
  .line { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .wire { flex: 1; height: 2px; background: var(--line); position: relative; }
  .wire i { position: absolute; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: zip 1.1s linear infinite; }
  @keyframes zip { from { left: 0 } to { left: calc(100% - 10px) } }
  footer { padding: 10px 16px 12px; }
</style>
<title-bar></title-bar>
<main>
  <div class="line">
    <svg class="icon" width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="4" width="22" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 24h8 M14 19v5 M7 9h8 M7 13h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <div class="wire"><i></i></div>
    <svg width="30" height="30" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5C2 2.7 2.7 2 3.5 2h9c.8 0 1.5.7 1.5 1.5v6c0 .8-.7 1.5-1.5 1.5H7l-3 3v-3h-.5C2.7 11 2 10.3 2 9.5z" fill="#FFD54A" stroke="#6b4300" stroke-width="0.7"/><circle cx="5.5" cy="6.5" r="0.9" fill="#6b4300"/><circle cx="8" cy="6.5" r="0.9" fill="#6b4300"/><circle cx="10.5" cy="6.5" r="0.9" fill="#6b4300"/></svg>
  </div>
  <b id="step">Dialing…</b>
  <div class="bar sunken" id="bar"></div>
  <label class="check"><input type="checkbox" id="modem"><span>Modem sound</span></label>
</main>
<footer>
  <span id="status" class="small muted" role="status"></span>
  <button class="btn" id="skip" hidden>Skip</button>
  <button class="btn" id="cancel">Cancel</button>
</footer>
<script src="connect.js"></script>
