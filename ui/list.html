<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Buddy List</title>
<link rel="stylesheet" href="xp.css">
<script src="chrome.js"></script>
<style>
  .banner .col { flex: 1; gap: 3px; }
  #me-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  #me { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #back { flex: none; height: 19px; min-width: 0; padding: 0 7px; font-size: 11px; white-space: nowrap; }
  #list { flex: 1; min-height: 0; margin: 8px 8px 0; overflow: auto; }
  .group, .buddy { display: flex; align-items: center; width: 100%; border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  .group { gap: 5px; padding: 5px 6px; font-weight: bold; }
  .group[aria-expanded=false] svg { transform: rotate(-90deg); }
  .buddy { gap: 7px; padding: 4px 8px 4px 18px; }
  .buddy .tile { width: 24px; height: 24px; font-size: 15px; }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .who > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .snip { font-size: 11px; color: var(--muted); }
  .fresh .sn { font-weight: bold; }
  .dim .sn { color: var(--muted); }
  .dim .tile { opacity: 0.7; }
  .idle .snip { font-style: italic; }
  .pill { flex: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--badge); color: #fff; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .bottom { flex: none; padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 9px; }
  .ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); padding: 0 1px; }
  .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .actions .btn { height: 46px; min-width: 0; flex-direction: column; gap: 3px; font-size: 11px; }
</style>
<title-bar min></title-bar>
<div class="banner">
  <svg width="32" height="32" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5C2 2.7 2.7 2 3.5 2h9c.8 0 1.5.7 1.5 1.5v6c0 .8-.7 1.5-1.5 1.5H7l-3 3v-3h-.5C2.7 11 2 10.3 2 9.5z" fill="#FFD54A" stroke="#6b4300" stroke-width="0.7"/><circle cx="5.5" cy="6.5" r="0.9" fill="#6b4300"/><circle cx="8" cy="6.5" r="0.9" fill="#6b4300"/><circle cx="10.5" cy="6.5" r="0.9" fill="#6b4300"/></svg>
  <div class="col">
    <span class="wordmark">Netpals</span>
    <div id="me-row"><span id="me"></span><button class="btn" id="back" hidden>I'm back</button></div>
  </div>
</div>
<div id="list" class="sunken" role="list"></div>
<div class="bottom">
  <div class="col" style="gap: 2px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px">
      <label for="chat"><b>Chattiness</b></label>
      <span class="small muted" id="chat-label"></span>
    </div>
    <input id="chat" type="range" min="0" max="4" step="1">
    <div class="ticks" aria-hidden="true"><span>off</span><span>2</span><span>5</span><span>10</span><span>20</span></div>
  </div>
  <div class="actions">
    <button class="btn" id="away"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2h7l3 3v11H4z M11 2v3h3 M6.5 8h5 M6.5 11h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>Away</span></button>
    <button class="btn" id="add"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 16c0-3 2.5-5 5.5-5s5.5 2 5.5 5 M14 4v5 M11.5 6.5h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Add</span></button>
    <button class="btn" id="chat"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 3.5h9v6H5.5L3 11.5v-2H2z M8 9.5h8v5.5h-1.5v2l-2.5-2H8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>Chat</span></button>
    <button class="btn" id="setup"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.5v2.5 M9 14v2.5 M1.5 9H4 M14 9h2.5 M3.7 3.7l1.8 1.8 M12.5 12.5l1.8 1.8 M3.7 14.3l1.8-1.8 M12.5 5.5l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Setup</span></button>
  </div>
</div>
<script src="list.js"></script>
